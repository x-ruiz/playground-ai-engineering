[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yt-to-obsidian"
version = "0.1.0"
description = "Cross-platform YouTube transcript watcher and headless Antigravity agent pipeline for Obsidian notes"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "watchdog>=4.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
yt-to-obsidian = "yt_to_obsidian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_to_obsidian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
