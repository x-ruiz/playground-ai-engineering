# Configuration for yt-to-obsidian
# Copy to config.yaml (gitignored) or ~/.config/yt-to-obsidian/config.yaml and customize.

watch:
  path: "~/Downloads"
  recursive: false
  allowed_extensions: [".txt", ".md", ".srt", ".vtt"]
  debounce_ms: 500
  stability_checks: 2
  stability_timeout_seconds: 15.0

vault:
  # Relative paths resolve against the directory containing this config file.
  path: "../../obsidian-notes"
  # Staging subdirectory inside vault.path (or an absolute path)
  staging_dir: "staging"

state:
  db_path: "~/.local/state/yt-to-obsidian/state.db"
  log_file: "~/.local/state/yt-to-obsidian/logs/yt-to-obsidian.log"
  log_level: "INFO"

post_process:
  # "keep" leaves the original transcript in watch.path; "move" archives it into archive_dir
  action: "keep"
  archive_dir: "~/Downloads/processed-transcripts"

runner:
  backend: "agy-cli"
  # Leave null to auto-resolve via PATH, /opt/homebrew/bin/agy, /usr/local/bin/agy, ~/.local/bin/agy
  agy_binary: null
  skill_name: "obsidian-youtube-note"
  # Leave null to auto-resolve from this skill directory or ~/.gemini/config/skills/<skill_name>
  skill_dir: null
  model: null
  effort: null
  timeout_seconds: 300
  max_retries: 1
  strict_validation_warnings: true

notifications:
  enabled: true
