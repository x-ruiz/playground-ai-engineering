[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "obsidian-note-agent"
version = "0.2.0"
description = "Google ADK URL-driven agent generating Mastery Framework Obsidian notes and update drafts from YouTube, article, and documentation URLs"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27,<1.0",
    "mcp>=1.6,<2.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "trafilatura>=1.12,<3.0",
    "youtube-transcript-api>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
obsidian-note = "obsidian_note_agent.cli:main"
obsidian-note-mcp = "obsidian_note_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_note_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
